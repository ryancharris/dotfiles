# Quick access terminal kitten config
# Docs: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

# Window positioning
edge bottom
lines 25

# Show in Cmd+Tab switcher
macos_hide_from_tasks no

# Focus management
focus_follows_mouse no

# Appearance
background_opacity 0.98

# Dock the tray to an edge (vim-style: h=left, j=bottom, k=top, l=right)
kitty_override map ctrl+shift+h remote_control_script tray-edge.sh left
kitty_override map ctrl+shift+j remote_control_script tray-edge.sh bottom
kitty_override map ctrl+shift+k remote_control_script tray-edge.sh top
kitty_override map ctrl+shift+l remote_control_script tray-edge.sh right

# Toggle full screen and back
kitty_override map ctrl+shift+m remote_control_script tray-maximize.sh

# Resize tray thickness while open (ctrl+shift+up/down, +/- 5, see tray-resize.sh)
kitty_override map ctrl+shift+up remote_control_script tray-resize.sh 5
kitty_override map ctrl+shift+down remote_control_script tray-resize.sh -5
