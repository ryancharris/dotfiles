# Quick access terminal kitten config
# Docs: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

# Window positioning
edge bottom
lines 25

# Show in Cmd+Tab switcher
macos_hide_from_tasks no

# Focus management
focus_follows_mouse no

# Appearance
background_opacity 1.0

# Neon top strip. NOTE: kitty does not draw OS-window borders on macOS (verified
# 0.50.0: window_border_width/draw_window_borders_for_single_window silently
# render nothing, even in plain windows), so the top accent is a one-line tab bar.
kitty_override tab_bar_min_tabs 1
kitty_override tab_bar_edge top
kitty_override tab_bar_style powerline
kitty_override tab_bar_background #39ff14
kitty_override active_tab_background #39ff14
kitty_override inactive_tab_background #39ff14
kitty_override active_tab_foreground #39ff14
kitty_override inactive_tab_foreground #39ff14
kitty_override tab_title_template " "

# Resize tray height while open (ctrl+shift+up/down, +/- 5 lines, clamped 5-60)
kitty_override map ctrl+shift+up remote_control_script tray-resize.sh 5
kitty_override map ctrl+shift+down remote_control_script tray-resize.sh -5
