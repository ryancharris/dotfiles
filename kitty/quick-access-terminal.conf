# Quick access terminal kitten config
# Docs: https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/

# Window positioning
edge bottom
lines 25

# Show in Cmd+Tab switcher
macos_hide_from_tasks no

# Focus management
focus_follows_mouse no

# Appearance
background_opacity 1.0

# Border around the tray (only the top edge is visible when docked at the bottom)
kitty_override draw_window_borders_for_single_window yes
kitty_override window_border_width 5px
kitty_override active_border_color #39ff14
kitty_override inactive_border_color #39ff14

# Resize tray height while open (ctrl+shift+up/down, +/- 5 lines, clamped 5-60)
kitty_override map ctrl+shift+up remote_control_script tray-resize.sh 5
kitty_override map ctrl+shift+down remote_control_script tray-resize.sh -5
