model = "gpt-5.6-luna"

# Auto-approve edits/commands inside the workspace; still ask before
# touching anything outside it or hitting the network.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
model_reasoning_effort = "medium"

[sandbox_workspace_write]
network_access = false

# Runs on notifications (e.g. approval requests, turn completion).
notify = ["/Users/ryan/dotfiles/agents/ring-bell.sh"]

[tui]
status_line = [
  "model-with-reasoning",
  "fast-mode",
  "context-used",
  "current-dir",
  "git-branch",
  "pull-request-number",
]

[tui.model_availability_nux]
gpt-6-astra = 4

[features]
plugins = true
hooks = true
plugin_hooks = true

[plugins."crit@local"]
enabled = true

[hooks.state]

[hooks.state."crit@local:hooks/hooks.json:stop:0:0"]
trusted_hash = "sha256:bf6ad428ae7902810fa2d68d8db42228377af118aa18508ad0eccf73a95ed1f8"
